<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab 1: New Words 学习动线</title>
    <style>
        body { font-family: 'Comic Sans MS', 'Segoe UI', Tahoma, sans-serif; background-color: #f0fdf4; color: #333; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 30px; width: 100%; max-width: 600px; text-align: center; min-height: 400px;}
        
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .tab-btn { padding: 10px 20px; font-size: 18px; font-weight: bold; border: none; background: transparent; color: #94a3b8; cursor: pointer; }
        .tab-btn.active { color: #3b82f6; border-bottom: 3px solid #3b82f6; }
        
        .word-selector { margin-bottom: 20px; }
        .word-btn { background-color: #eff6ff; color: #3b82f6; border: 2px solid #bfdbfe; border-radius: 10px; padding: 10px 15px; margin: 0 5px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .word-btn:hover { background-color: #dbeafe; }
        .word-btn.completed { background-color: #d1fae5; color: #059669; border-color: #6ee7b7; }
        
        .step-container { display: none; animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }
        .shake-error { animation: shake 0.4s; border-color: #ef4444 !important; background-color: #fee2e2 !important; }

        .word-display { font-size: 54px; font-weight: 800; color: #1e293b; letter-spacing: 2px; margin: 10px 0; }
        .meta-display { display: flex; gap: 15px; justify-content: center; align-items: center; font-size: 20px; color: #64748b; margin-bottom: 20px; font-family: 'Arial', sans-serif; }
        .pos-tag { background-color: #e2e8f0; padding: 4px 10px; border-radius: 6px; font-size: 16px; font-weight: bold; color: #475569; }
        
        /* 独立音频控制栏样式 */
        .audio-bar { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; background-color: #f8fafc; padding: 10px; border-radius: 12px; }
        .play-btn { background-color: #3b82f6; color: white; border: none; padding: 8px 16px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .play-btn:hover { background-color: #2563eb; }
        .speed-select { padding: 8px; font-size: 16px; border-radius: 8px; border: 2px solid #cbd5e1; outline: none; background-color: white; color: #475569; cursor: pointer; font-family: inherit; }

        .syllable-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .syllable-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 20px; border-radius: 12px; cursor: pointer; transition: 0.2s; border: 2px solid transparent; line-height: 1.2; }
        .syllable-box:hover { transform: scale(1.05); }
        .syl-text { font-size: 28px; font-weight: bold; }
        .syl-phonetic { font-size: 18px; font-family: 'Arial', sans-serif; margin-top: 4px; }

        .scramble-btn { background-color: white; color: #333; border: 2px solid #e2e8f0; margin: 5px; font-size: 24px; padding: 10px 20px; border-radius: 10px; cursor: pointer; }
        .scramble-btn.selected { visibility: hidden; }
        
        .hint-blocks { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .hint-block { width: 65px; height: 60px; background-color: #cbd5e1; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; line-height: 1.1; }
        .hint-block.revealed { background-color: transparent; border: 2px solid #e2e8f0; }
        .hint-block.locked { opacity: 0.4; cursor: not-allowed; }
        
        .input-row { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 10px; }
        .type-input { font-size: 24px; padding: 10px; text-align: center; width: 50%; border: 2px dashed #94a3b8; border-radius: 10px; outline: none; }
        .type-input:focus { border-color: #3b82f6; }
        .audio-btn-small { border: none; background: #e0e7ff; color: #3b82f6; border-radius: 50%; width: 45px; height: 45px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .audio-btn-small:hover { background: #c7d2fe; transform: scale(1.1); }

        .img-options { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .img-card { font-size: 60px; padding: 20px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 15px; cursor: pointer; transition: 0.2s; }
        .img-card:hover { transform: scale(1.05); }

        .context-box { font-size: 28px; padding: 30px; background: #fffbeb; border: 2px solid #fde68a; border-radius: 15px; margin-top: 20px; cursor: pointer; }
        .blank-space { display: inline-block; width: 100px; border-bottom: 3px solid #333; height: 30px; margin: 0 10px; vertical-align: middle; }
        .filled-word { color: #2563eb; font-weight: bold; text-decoration: underline; }
        .context-meta { display: none; margin-top: 20px; font-size: 20px; color: #64748b; line-height: 1.6; }

        .action-btn { background-color: #10b981; color: white; border: none; padding: 12px 25px; font-size: 18px; border-radius: 50px; cursor: pointer; margin-top: 20px; font-weight: bold; }
        .action-btn:hover { background-color: #059669; }
        .feedback { font-size: 20px; font-weight: bold; color: #ef4444; margin-top: 15px; min-height: 30px; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active">🌟 Tab 1: New Words</button>
        <button class="tab-btn" onclick="alert('即将开发：盲猜与复习模式')">🛡️ Tab 2: Review</button>
    </div>

    <div class="word-selector" id="wordSelector">
        <button class="word-btn" id="btn-glasses" onclick="startWord('glasses')">glasses</button>
        <button class="word-btn" id="btn-nephew" onclick="startWord('nephew')">nephew</button>
        <button class="word-btn" id="btn-computer" onclick="startWord('computer')">computer</button>
    </div>

    <hr style="border: 0; border-top: 2px dashed #e2e8f0; margin-bottom: 20px;">

    <!-- 步骤 1 & 2 -->
    <div id="step12" class="step-container">
        <div class="word-display" id="s1-word"></div>
        <div class="meta-display">
            <span class="pos-tag" id="s1-pos"></span>
            <span id="s1-phonetic"></span>
            <span id="s1-translation"></span>
        </div>
        
        <!-- 首页带语速的音频控制 -->
        <div class="audio-bar">
            <button class="play-btn" onclick="playMainAudio()">🔊 听发音</button>
            <select class="speed-select" id="speed-step1">
                <option value="1.0">1.0x 正常</option>
                <option value="0.75">0.75x 较慢</option>
                <option value="0.5">0.5x 慢速</option>
            </select>
        </div>

        <p style="color: #94a3b8; font-size: 14px;">点击音节听发音：</p>
        <div class="syllable-container" id="s1-syllables"></div>
        <button class="action-btn" onclick="goToStep(3)">下一步：重组拼写 ➡️</button>
    </div>

    <!-- 步骤 3 -->
    <div id="step3" class="step-container">
        <h3>按顺序点击复原单词</h3>
        <div class="syllable-container" id="s3-target" style="min-height: 60px; background: #f8fafc; border-radius: 10px; align-items: center;"></div>
        <div id="s3-options"></div>
        <div class="feedback" id="s3-msg"></div>
        
        <div id="s3-success-area" style="display:none; margin-top:15px;">
            <button class="action-btn" onclick="playAudio(currentData.audio, currentWord)" style="background-color:#3b82f6; margin-right: 15px;">🔊 听发音</button>
            <span id="s3-success-phonetic" style="font-size:22px; color:#475569; font-family:'Arial'; font-weight:bold; vertical-align: middle;"></span>
            <br>
            <button class="action-btn" onclick="goToStep(4)">进入默写 ➡️</button>
        </div>
    </div>

    <!-- 步骤 4 -->
    <div id="step4" class="step-container">
        <h3>默写挑战</h3>
        <p style="color: #94a3b8; font-size: 14px;">点击上方数字方块获取局部提示</p>
        <div class="hint-blocks" id="s4-hints"></div>
        <div class="input-row">
            <input type="text" class="type-input" id="s4-input" placeholder="输入拼写..." autocomplete="off">
            <button class="audio-btn-small" onclick="playAudio(currentData.audio, currentWord)">🔊</button>
        </div>
        <button class="action-btn" onclick="checkStep4()">提交答案</button>
        <div class="feedback" id="s4-msg"></div>
    </div>

    <!-- 步骤 5 -->
    <div id="step5" class="step-container">
        <h3>哪一个是它的意思？</h3>
        <div class="img-options" id="s5-options"></div>
        <div class="feedback" id="s5-msg"></div>
    </div>

    <!-- 步骤 6 -->
    <div id="step6" class="step-container">
        <h3>读一读</h3>
        <p style="color: #94a3b8; font-size: 14px;">点击空白处，填入单词并跟读！</p>
        <div class="context-box" id="s6-context" onclick="completeContext()"></div>
        
        <div class="context-meta" id="s6-meta">
            <div id="s6-context-phonetic" style="font-family: Arial; margin-bottom: 5px;"></div>
            <div id="s6-context-translation" style="font-weight: bold; color: #333; margin-bottom: 15px;"></div>
            
            <!-- 语境页带语速的音频控制 -->
            <div class="audio-bar" style="margin-bottom: 0;">
                <button class="play-btn" onclick="playContextAudio()">🔊 听句子</button>
                <select class="speed-select" id="speed-step6">
                    <option value="1.0">1.0x 正常</option>
                    <option value="0.75">0.75x 较慢</option>
                    <option value="0.5">0.5x 慢速</option>
                </select>
            </div>
        </div>
        
        <div class="feedback" id="s6-msg"></div>
    </div>
</div>

<script>
    const wordData = {
        'glasses': {
            audio: 'glassess.mp3', 
            phonetic: '[ˈɡlæsɪz]',
            pos: '名词',
            translation: '眼镜',
            syllables: [
                { text: 'glass', phonetic: '[ɡlæs]', color: '#ef4444', bg: '#fee2e2' },
                { text: 'es', phonetic: '[ɪz]', color: '#3b82f6', bg: '#dbeafe' }
            ],
            images: ['👟', '👓', '🎩'],
            correctImgIndex: 1, 
            context: {
                text: "sun [BLANK]",
                translation: "太阳眼镜",
                phonetic: "[sʌn ˈɡlæsɪz]",
                audio: "sun_glasses.mp3"
            }
        },
        'nephew': {
            audio: 'nephew.mp3',
            phonetic: '[ˈnefjuː]',
            pos: '名词',
            translation: '侄子；外甥',
            syllables: [
                { text: 'ne', phonetic: '[ne]', color: '#f59e0b', bg: '#fef3c7' },
                { text: 'phew', phonetic: '[fjuː]', color: '#10b981', bg: '#d1fae5' }
            ],
            images: ['👩', '👦', '🐶'],
            correctImgIndex: 1,
            context: {
                text: "He is my [BLANK].",
                translation: "他是我的侄子。",
                phonetic: "[hiː ɪz maɪ ˈnefjuː]",
                audio: "He_is_my_nephew.mp3"
            }
        },
        'computer': {
            audio: 'computer.mp3',
            phonetic: '[kəmˈpjuːtər]',
            pos: '名词',
            translation: '电脑',
            syllables: [
                { text: 'com', phonetic: '[kəm]', color: '#8b5cf6', bg: '#ede9fe' },
                { text: 'pu', phonetic: '[ˈpjuː]', color: '#ec4899', bg: '#fce7f3' },
                { text: 'ter', phonetic: '[tər]', color: '#14b8a6', bg: '#ccfbf1' }
            ],
            images: ['📺', '💻', '📱'],
            correctImgIndex: 1,
            context: {
                text: "a [BLANK]",
                translation: "一台电脑",
                phonetic: "[ə kəmˈpjuːtər]",
                audio: "a_computer.mp3"
            }
        }
    };

    let currentWord = '';
    let currentData = null;
    let s3TargetArr = [];
    let activeAudioObj = null; // 用于追踪当前播放的音频，避免重复播放重叠

    // 统一的带语速音频播放函数
    function playAudio(filename, fallbackText, rate = 1) {
        try {
            if (activeAudioObj) {
                activeAudioObj.pause();
                activeAudioObj.currentTime = 0;
            }
            
            activeAudioObj = new Audio(filename);
            activeAudioObj.playbackRate = rate; // 调节HTML5音频语速
            activeAudioObj.play().catch(e => {
                // 回退到TTS时也带上语速
                let utterance = new SpeechSynthesisUtterance(fallbackText);
                utterance.lang = 'en-US';
                utterance.rate = rate; 
                window.speechSynthesis.speak(utterance);
            });
        } catch(error) {
            console.log("音频异常");
        }
    }

    // 首页的播放按钮触发
    function playMainAudio() {
        let speed = parseFloat(document.getElementById('speed-step1').value);
        playAudio(currentData.audio, currentWord, speed);
    }

    // 语境页的播放按钮触发
    function playContextAudio() {
        let speed = parseFloat(document.getElementById('speed-step6').value);
        let fullText = currentData.context.text.replace('[BLANK]', currentWord);
        playAudio(currentData.context.audio, fullText, speed);
    }

    function startWord(word) {
        currentWord = word;
        currentData = wordData[word];
        if (!currentData) return;
        
        document.querySelectorAll('.step-container').forEach(el => el.style.display = 'none');
        document.getElementById('step12').style.display = 'block';
        
        // 重置下拉框为正常语速
        document.getElementById('speed-step1').value = "1.0";
        document.getElementById('speed-step6').value = "1.0";
        
        document.getElementById('s1-word').innerText = word;
        document.getElementById('s1-phonetic').innerText = currentData.phonetic;
        document.getElementById('s1-pos').innerText = currentData.pos;
        document.getElementById('s1-translation').innerText = currentData.translation;
        
        let sylBox = document.getElementById('s1-syllables');
        sylBox.innerHTML = '';
        currentData.syllables.forEach(s => {
            let div = document.createElement('div');
            div.className = 'syllable-box';
            div.style.color = s.color;
            div.style.backgroundColor = s.bg;
            div.innerHTML = `<div class="syl-text">${s.text}</div><div class="syl-phonetic">${s.phonetic}</div>`;
            div.onclick = () => playAudio('none.mp3', s.text, 0.7);
            sylBox.appendChild(div);
        });

        setTimeout(() => playMainAudio(), 500);
    }

    function goToStep(stepNum) {
        document.querySelectorAll('.step-container').forEach(el => el.style.display = 'none');
        document.getElementById('step' + stepNum).style.display = 'block';
        if(stepNum === 3) initStep3();
        if(stepNum === 4) initStep4();
        if(stepNum === 5) initStep5();
        if(stepNum === 6) initStep6();
    }

    function initStep3() {
        s3TargetArr = [];
        document.getElementById('s3-target').innerHTML = '';
        document.getElementById('s3-msg').innerText = '';
        document.getElementById('s3-success-area').style.display = 'none';
        
        let optionsBox = document.getElementById('s3-options');
        optionsBox.innerHTML = '';
        
        let scrambled = [...currentData.syllables].sort(() => Math.random() - 0.5);
        scrambled.forEach(s => {
            let btn = document.createElement('button');
            btn.className = 'scramble-btn';
            btn.innerText = s.text;
            btn.style.color = s.color;
            btn.onclick = function() {
                playAudio('none.mp3', s.text, 1);
                s3TargetArr.push(s.text);
                this.classList.add('selected');
                
                let targetSpan = document.createElement('span');
                targetSpan.innerText = s.text;
                targetSpan.style.color = s.color;
                targetSpan.style.margin = '0 2px';
                targetSpan.style.fontSize = '32px';
                targetSpan.style.fontWeight = 'bold';
                document.getElementById('s3-target').appendChild(targetSpan);
                
                checkStep3();
            };
            optionsBox.appendChild(btn);
        });
    }

    function checkStep3() {
        let currentSpelling = s3TargetArr.join('');
        if (currentSpelling === currentWord) {
            document.getElementById('s3-msg').style.color = '#10b981';
            document.getElementById('s3-msg').innerText = '🎉 拼写正确！';
            
            document.getElementById('s3-success-area').style.display = 'block';
            document.getElementById('s3-success-phonetic').innerText = currentData.phonetic;
            playAudio(currentData.audio, currentWord);
            
        } else if (!currentWord.startsWith(currentSpelling)) {
            document.getElementById('s3-msg').style.color = '#ef4444';
            document.getElementById('s3-msg').innerText = '❌ 顺序错了，重新试试！';
            setTimeout(initStep3, 1000);
        }
    }

    function initStep4() {
        document.getElementById('s4-input').value = '';
        document.getElementById('s4-msg').innerText = '';
        let hintBox = document.getElementById('s4-hints');
        hintBox.innerHTML = '';
        
        let revealedCount = 0;
        let maxReveal = currentData.syllables.length - 1; 

        currentData.syllables.forEach((s, index) => {
            let block = document.createElement('div');
            block.className = 'hint-block';
            block.innerText = index + 1;
            block.onclick = function() {
                if (this.classList.contains('revealed') || this.classList.contains('locked')) return;
                
                this.innerHTML = `<div style="font-size:20px;">${s.text}</div>`;
                this.style.color = s.color;
                this.style.backgroundColor = s.bg;
                this.classList.add('revealed');
                playAudio('none.mp3', s.text, 0.8);
                
                revealedCount++;
                
                if (revealedCount >= maxReveal) {
                    Array.from(hintBox.children).forEach(child => {
                        if (!child.classList.contains('revealed')) {
                            child.classList.add('locked');
                        }
                    });
                }
            };
            hintBox.appendChild(block);
        });
        document.getElementById('s4-input').focus();
    }

    function checkStep4() {
        let val = document.getElementById('s4-input').value.trim().toLowerCase();
        if(val === currentWord) {
            document.getElementById('s4-msg').style.color = '#10b981';
            document.getElementById('s4-msg').innerText = '✅ 默写成功！';
            playAudio('none.mp3', 'Good job');
            setTimeout(() => goToStep(5), 1000);
        } else {
            document.getElementById('s4-msg').style.color = '#ef4444';
            document.getElementById('s4-msg').innerText = '拼写有点问题哦，再检查一下！';
        }
    }

    function initStep5() {
        document.getElementById('s5-msg').innerText = '';
        let box = document.getElementById('s5-options');
        box.innerHTML = '';
        
        currentData.images.forEach((img, index) => {
            let card = document.createElement('div');
            card.className = 'img-card';
            card.innerText = img;
            card.onclick = function() {
                if(index === currentData.correctImgIndex) {
                    document.getElementById('s5-msg').style.color = '#10b981';
                    document.getElementById('s5-msg').innerText = '✨ 选对啦！';
                    playAudio(currentData.audio, currentWord);
                    setTimeout(() => goToStep(6), 1500);
                } else {
                    this.classList.add('shake-error');
                    setTimeout(() => this.classList.remove('shake-error'), 400); 
                    
                    document.getElementById('s5-msg').style.color = '#ef4444';
                    document.getElementById('s5-msg').innerText = '不对哦，再想一想这是什么意思？';
                }
            };
            box.appendChild(card);
        });
    }

    function initStep6() {
        document.getElementById('s6-msg').innerText = '';
        document.getElementById('s6-meta').style.display = 'none'; 
        
        let sentence = currentData.context.text;
        let htmlStr = sentence.replace('[BLANK]', `<span class="blank-space" id="sentence-blank"></span>`);
        document.getElementById('s6-context').innerHTML = htmlStr;
        
        document.getElementById('s6-context-phonetic').innerText = currentData.context.phonetic;
        document.getElementById('s6-context-translation').innerText = currentData.context.translation;
    }

    function completeContext() {
        let blank = document.getElementById('sentence-blank');
        if(blank) {
            let filled = document.createElement('span');
            filled.className = 'filled-word';
            filled.innerText = currentWord;
            blank.replaceWith(filled);
            
            document.getElementById('s6-meta').style.display = 'block';
            
            playContextAudio();
            
            document.getElementById('s6-msg').style.color = '#10b981';
            document.getElementById('s6-msg').innerText = '🎉 任务完成！';
            document.getElementById('btn-' + currentWord).classList.add('completed');
        }
    }
</script>

</body>
</html>
